<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Infinite AI Rap Battle</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #090909;
    color: white;

    font-size: clamp(64px, 12vw, 180px);
    font-weight: 900;

    cursor: pointer;
    user-select: none;
}

#startScreen:hover {
    background: #111;
}

.topbar {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    background: #111;
    border-bottom: 1px solid #333;
}

.title {
    font-size: 24px;
    font-weight: 900;
}

.bpm {
    font-size: 14px;
    opacity: 0.6;
}

.battle {
    display: grid;
    grid-template-columns: 1fr 1fr;

    height: calc(100vh - 70px);
}

.rapper {
    position: relative;

    padding: 30px;

    overflow: hidden;

    transition: background 0.15s;
}

.rapper:first-child {
    border-right: 1px solid #333;
}

.rapper.active {
    background: #151515;
}

.rapper-name {
    font-size: 34px;
    font-weight: 900;

    margin-bottom: 30px;
}

.status {
    position: absolute;

    top: 36px;
    right: 30px;

    font-size: 13px;

    opacity: 0.45;
}

.rapper.active .status {
    opacity: 1;
}

.lyrics {
    display: flex;
    flex-direction: column;

    gap: 18px;

    font-size: 24px;
    line-height: 1.4;
}

.line {
    opacity: 0;

    transform: translateY(12px);

    animation: appear 0.25s forwards;
}

.line.old {
    opacity: 0.25;
}

@keyframes appear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.beat {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    opacity: 0.2;
}

.beat.hit {
    animation: beatPulse 0.15s;
}

@keyframes beatPulse {
    0% {
        transform: translateX(-50%) scale(2.3);
        opacity: 1;
    }

    100% {
        transform: translateX(-50%) scale(1);
        opacity: 0.2;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    Start
</div>

<div class="topbar">

    <div class="title">
        INFINITE RAP BATTLE
    </div>

    <div class="bpm">
        100 BPM
    </div>

</div>

<div class="battle">

    <div class="rapper" id="rapper0">

        <div class="rapper-name">
            MC BYTE
        </div>

        <div class="status">
            WAITING
        </div>

        <div class="lyrics" id="lyrics0"></div>

    </div>

    <div class="rapper" id="rapper1">

        <div class="rapper-name">
            GPT DAWG
        </div>

        <div class="status">
            WAITING
        </div>

        <div class="lyrics" id="lyrics1"></div>

    </div>

</div>

<div class="beat" id="beatDot"></div>

<audio
    id="music"
    src="rapsong.mp3"
    preload="auto">
</audio>

<script>

/* ============================
   TIMING
============================ */

const BPM = 100;

const BEAT_MS = 60000 / BPM;
// 600ms

const BEATS_PER_BAR = 4;

const BAR_MS = BEAT_MS * BEATS_PER_BAR;
// 2400ms

const RAP_START_DELAY = BAR_MS * 2;
// 4800ms
// Bar 1 starts at 0.0
// Bar 2 starts at 2.4
// Bar 3 starts at 4.8

const BARS_PER_TURN = 4;


/* ============================
   ELEMENTS
============================ */

const startScreen =
    document.getElementById("startScreen");

const music =
    document.getElementById("music");

const beatDot =
    document.getElementById("beatDot");

const rapperElements = [
    document.getElementById("rapper0"),
    document.getElementById("rapper1")
];

const lyricsElements = [
    document.getElementById("lyrics0"),
    document.getElementById("lyrics1")
];


/* ============================
   RAP DATA
============================ */

const subjects = [
    "your haircut",
    "your Wi-Fi",
    "your homework",
    "your Roblox avatar",
    "your school bag",
    "your calculator",
    "your lunch",
    "your Chromebook",
    "your shoes",
    "your playlist",
    "your handwriting",
    "your group project",
    "your internet",
    "your chair",
    "your locker",
    "your maths grade"
];

const weirdObjects = [
    "microwave",
    "spoon",
    "printer",
    "banana",
    "battery",
    "chair",
    "sandwich",
    "traffic cone",
    "Minecraft torch",
    "wet sock",
    "crouton",
    "cardboard sword",
    "school mouse",
    "broken charger",
    "empty lunchbox"
];

const reactions = [
    "tragic",
    "criminal",
    "embarrassing",
    "concerning",
    "outrageous",
    "suspicious",
    "diabolical",
    "painful"
];

const rhymeGroups = [

    [
        "night",
        "light",
        "fight",
        "right",
        "sight",
        "bright",
        "flight",
        "tight"
    ],

    [
        "brain",
        "train",
        "rain",
        "pain",
        "chain",
        "plane",
        "drain",
        "lane"
    ],

    [
        "phone",
        "cone",
        "stone",
        "zone",
        "known",
        "grown",
        "throne",
        "clone"
    ],

    [
        "school",
        "fool",
        "pool",
        "tool",
        "cool",
        "rule",
        "stool",
        "fuel"
    ],

    [
        "screen",
        "green",
        "clean",
        "scene",
        "mean",
        "machine",
        "canteen",
        "routine"
    ],

    [
        "chair",
        "hair",
        "stare",
        "air",
        "bear",
        "square",
        "rare",
        "glare"
    ],

    [
        "clock",
        "rock",
        "block",
        "sock",
        "shock",
        "knock",
        "stock",
        "lock"
    ]

];


/* ============================
   HELPERS
============================ */

function random(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}

function newRhymeGroup() {

    return [
        ...random(rhymeGroups)
    ];

}


/* ============================
   STATE
============================ */

let currentRapper = 0;

let currentBar = 0;

let rhymeWords = newRhymeGroup();

let previousLine = "";

let started = false;

let rapInterval = null;

let beatInterval = null;


/* ============================
   UI
============================ */

function setActiveRapper(index) {

    rapperElements.forEach(
        (rapper, i) => {

            rapper.classList.toggle(
                "active",
                i === index
            );

            const status =
                rapper.querySelector(".status");

            status.textContent =
                i === index
                ? "RAPPING"
                : "WAITING";

        }
    );

}

function addLine(rapperIndex, text) {

    const container =
        lyricsElements[rapperIndex];

    const line =
        document.createElement("div");

    line.className = "line";

    line.textContent = text;

    container.appendChild(line);


    const lines =
        container.querySelectorAll(".line");


    if (lines.length > 5) {

        lines[
            lines.length - 6
        ].classList.add("old");

    }


    if (lines.length > 8) {

        lines[0].remove();

    }

}


/* ============================
   RAP GENERATION
============================ */

function generateLine(rhymeWord) {

    const enemy =
        currentRapper === 0
        ? "GPT Dawg"
        : "MC Byte";

    const type =
        Math.floor(
            Math.random() * 10
        );

    switch (type) {

        case 0:

            return `${enemy}, ${random(subjects)} looking rough in the ${rhymeWord}`;

        case 1:

            return `Bro pulled up holding a ${random(weirdObjects)}, calling it ${rhymeWord}`;

        case 2:

            return `You dropped that verse and somehow damaged the ${rhymeWord}`;

        case 3:

            return `${enemy} started cooking then immediately burnt the ${rhymeWord}`;

        case 4:

            return `That last bar was ${random(reactions)}, go apologise to the ${rhymeWord}`;

        case 5:

            return `Your whole rap career just disconnected from the ${rhymeWord}`;

        case 6:

            return `Bro got ${random(subjects)} and still thinks he owns the ${rhymeWord}`;

        case 7:

            return `I heard that flow and immediately blamed the ${rhymeWord}`;

        case 8:

            return `You tried to roast me but somehow complimented my ${rhymeWord}`;

        case 9:

            if (previousLine) {

                const words =
                    previousLine
                    .split(" ")
                    .map(word =>
                        word.replace(
                            /[^a-zA-Z]/g,
                            ""
                        )
                    )
                    .filter(Boolean);

                const picked =
                    random(words);

                return `Bro really said "${picked}" and thought that would save his ${rhymeWord}`;

            }

            return `Nobody knows what's happening, including the ${rhymeWord}`;

    }

}


/* ============================
   RAP LOOP
============================ */

function rapBar() {

    if (rhymeWords.length === 0) {

        rhymeWords =
            newRhymeGroup();

    }


    const rhymeWord =
        rhymeWords.shift();


    const line =
        generateLine(
            rhymeWord
        );


    addLine(
        currentRapper,
        line
    );


    previousLine = line;

    currentBar++;


    if (
        currentBar >= BARS_PER_TURN
    ) {

        currentBar = 0;

        currentRapper =
            currentRapper === 0
            ? 1
            : 0;

        rhymeWords =
            newRhymeGroup();

        setActiveRapper(
            currentRapper
        );

    }

}


/* ============================
   BEAT FLASH
============================ */

function flashBeat() {

    beatDot.classList.remove(
        "hit"
    );

    void beatDot.offsetWidth;

    beatDot.classList.add(
        "hit"
    );

}


/* ============================
   START
============================ */

startScreen.addEventListener(
    "click",
    async () => {

        if (started) {
            return;
        }


        try {

            music.currentTime = 0;

            await music.play();

            started = true;


            startScreen.style.display =
                "none";


            /* Start visual beat immediately */

            flashBeat();

            beatInterval =
                setInterval(
                    flashBeat,
                    BEAT_MS
                );


            /* Bar 1 = music only
               Bar 2 = music only
               Bar 3 = rapper starts */

            setTimeout(
                () => {

                    currentRapper = 0;

                    currentBar = 0;

                    rhymeWords =
                        newRhymeGroup();

                    setActiveRapper(0);


                    rapBar();


                    rapInterval =
                        setInterval(
                            rapBar,
                            BAR_MS
                        );

                },
                RAP_START_DELAY
            );

        }

        catch (error) {

            console.error(
                "Could not play rapsong.mp3:",
                error
            );

            alert(
                "rapsong.mp3 could not be played. Make sure it is in the same folder as index.html."
            );

        }

    }
);


/* ============================
   AUDIO ERROR CHECK
============================ */

music.addEventListener(
    "error",
    () => {

        console.error(
            "Audio loading error:",
            music.error
        );

    }
);

</script>

</body>
</html>
