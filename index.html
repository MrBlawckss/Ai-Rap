<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite AI Rap Battle</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;
    color: white;

    font-size: clamp(70px, 13vw, 190px);
    font-weight: 900;

    cursor: pointer;
    user-select: none;

    transition:
        background 0.2s,
        letter-spacing 0.2s;
}

#startScreen:hover {
    background: #111;
    letter-spacing: 8px;
}

#page {
    width: 100%;
    height: 100%;

    transition:
        transform 0.08s,
        filter 0.08s;
}

.topbar {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: #111;
    border-bottom: 1px solid #333;
}

.title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
}

.bpm {
    font-size: 14px;
    opacity: 0.6;
}

.battle {
    display: grid;
    grid-template-columns: 1fr 1fr;

    height: calc(100vh - 70px - 190px);
}

.rapper {
    position: relative;

    padding: 30px;

    overflow: hidden;

    transition:
        background 0.15s,
        transform 0.12s,
        box-shadow 0.15s;
}

.rapper:first-child {
    border-right: 1px solid #333;
}

.rapper.active {
    background: #141414;

    box-shadow:
        inset 0 0 80px rgba(255,255,255,0.03);
}

.rapper.speaking {
    transform: scale(1.008);
}

.rapper-name {
    font-size: 38px;
    font-weight: 900;

    margin-bottom: 30px;

    transition:
        text-shadow 0.15s,
        transform 0.15s;
}

.rapper.active .rapper-name {
    text-shadow:
        0 0 18px rgba(255,255,255,0.4);
}

.status {
    position: absolute;

    top: 39px;
    right: 30px;

    font-size: 13px;
    font-weight: bold;

    opacity: 0.4;
}

.rapper.active .status {
    opacity: 1;
}

.lyrics {
    display: flex;
    flex-direction: column;

    gap: 18px;

    font-size: 24px;
    line-height: 1.35;
}

.line {
    opacity: 0;

    transform: translateY(10px);

    animation:
        lineAppear 0.18s forwards;

    transition:
        opacity 0.25s,
        transform 0.15s,
        text-shadow 0.15s;
}

.line.current {
    font-weight: bold;

    text-shadow:
        0 0 12px rgba(255,255,255,0.2);
}

.line.old {
    opacity: 0.3 !important;
}

@keyframes lineAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#visualizerContainer {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 190px;
    z-index: 100;

    background:
        linear-gradient(
            to top,
            #050505,
            #0b0b0b
        );

    border-top: 1px solid #333;

    overflow: hidden;
}

#visualizer {
    width: 100%;
    height: 100%;

    display: block;
}

.frequencyLabel {
    position: absolute;

    bottom: 5px;

    font-size: 10px;

    opacity: 0.35;

    pointer-events: none;
}

#lowLabel {
    left: 10px;
}

#midLabel {
    left: 50%;
    transform: translateX(-50%);
}

#highLabel {
    right: 10px;
}

#beatDot {
    position: fixed;

    left: 50%;
    bottom: 200px;

    width: 10px;
    height: 10px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: white;

    opacity: 0.2;

    z-index: 20;
}

#beatDot.hit {
    animation:
        beatHit 0.14s;
}

@keyframes beatHit {
    0% {
        transform:
            translateX(-50%)
            scale(2.8);

        opacity: 1;
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);

        opacity: 0.2;
    }
}

#barCounter {
    position: fixed;

    top: 82px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 12px;

    opacity: 0.35;

    z-index: 50;
}

#debugText {
    position: fixed;
    right: 12px;
    bottom: 200px;

    font-size: 11px;
    opacity: 0.55;
    z-index: 200;
    font-family: Consolas, monospace;
}
</style>
</head>

const BEAT_SECONDS =

/*
100 BPM:
1 beat = 0.6s
*/

const BAR_SECONDS =

1 bar = 2.4s
*/

/*
Rap starts at 9.6s:

Bar 1 = 0.0
Bar 2 = 2.4
Bar 3 = 4.8
Bar 4 = 7.2
Bar 5 = 9.6

So first AI line begins at BAR 5.

function random(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function newRhymeGroup() {
    return shuffle(random(rhymeGroups));
}

let started = false;
let currentRapper = 0;
let rapperBar = 0;
let rhymeWords = newRhymeGroup();
let previousLine = "";
let lastRapBar = -1;
let lastBeat = -1;

let voices = [];
let rapperVoices = [null, null];

function loadVoices() {
    voices = speechSynthesis.getVoices();
    const english = voices.filter(v => v.lang.toLowerCase().startsWith("en"));
    const pool = english.length ? english : voices;
    if (pool.length > 0) rapperVoices[0] = pool[0];
    if (pool.length > 1) rapperVoices[1] = pool[1];
    else rapperVoices[1] = pool[0] || null;
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speakLine(text, rapperIndex) {
    speechSynthesis.cancel();
    rapperElements.forEach(r => r.classList.remove("speaking"));

    const speech = new SpeechSynthesisUtterance(text);
    if (rapperVoices[rapperIndex]) speech.voice = rapperVoices[rapperIndex];

    if (rapperIndex === 0) {
        speech.rate = 2.05;
        speech.pitch = 0.72;
    } else {
        speech.rate = 2.0;
        speech.pitch = 1.15;
    }

    speech.volume = 1;
    speech.onstart = () => rapperElements[rapperIndex].classList.add("speaking");
    speech.onend = () => rapperElements[rapperIndex].classList.remove("speaking");
    speech.onerror = () => rapperElements[rapperIndex].classList.remove("speaking");
    speechSynthesis.speak(speech);
}

function setActiveRapper(rapperIndex) {
    rapperElements.forEach((rapper, index) => {
        rapper.classList.toggle("active", index === rapperIndex);
        rapper.querySelector(".status").textContent = index === rapperIndex ? "RAPPING" : "WAITING";
    });
}

function addLine(rapperIndex, text) {
    const container = lyricsElements[rapperIndex];

    container.querySelectorAll(".line").forEach(line => {
        line.classList.remove("current");
        line.classList.add("old");
    });

    const line = document.createElement("div");
    line.className = "line current";
    line.textContent = text;
    container.appendChild(line);

    const lines = container.querySelectorAll(".line");
    if (lines.length > 7) lines[0].remove();
}

const fullBars = [

];

const responseBars = [
    word => `You really said "${word}" like that shit was supposed to save you`,
    word => `You used "${word}" in a bar and somehow made it sound unemployed`,
    word => `You said "${word}" with confidence, which honestly made it worse`,
    word => `The second you said "${word}", the beat tried to leave the room`,
    word => `You really built an entire line around "${word}" and still fucked it up`,
    word => `"${word}" was your best idea? Jesus Christ, we're in trouble`,
    word => `You dropped "${word}" like it was clever and nobody even blinked`,
    word => `You said "${word}" and somehow lowered the property value of this verse`

const rhymeTemplates = [
    rhyme => `You stepped to the mic and immediately lost the ${rhyme}`,
    rhyme => `Your whole career just got dragged through the ${rhyme}`,
    rhyme => `You call that a verse? I'd rather argue with the ${rhyme}`,
    rhyme => `That flow was so fucked I had to blame the ${rhyme}`,
    rhyme => `You walked in talking shit then got folded by the ${rhyme}`,
    rhyme => `Your last bar was so weak it got bullied by the ${rhyme}`,

    rhyme => `You tried to sound dangerous and got humbled by the ${rhyme}`
];

const subjectBars = [
    (enemy, subject) => `${enemy}, your ${subject} has more personality than your whole damn verse`,
    (enemy, subject) => `${enemy}, fix your ${subject} before you start talking shit to me`,
    (enemy, subject) => `${enemy}, even your ${subject} looks embarrassed to be associated with you`,
    (enemy, subject) => `${enemy}, your ${subject} is carrying your entire fucking reputation`,
    (enemy, subject) => `${enemy}, your ${subject} has seen better days and so has your flow`
];

const objectBars = [
    object => `You got less rhythm than a ${object} rolling down the stairs`,
    object => `I'd rather hear a ${object} freestyle than another one of your bars`,
    object => `Your flow sounds like somebody threw a ${object} into a ceiling fan`,
    object => `You got verbally outperformed by a fucking ${object}`,
    object => `A ${object} could write a cleaner verse than that shit`
];

function generateLine(rhymeWord) {
    const enemy = currentRapper === 0 ? "GPT Dawg" : "MC Byte";

    if (Math.random() < 0.35) {
        return random(fullBars);
    }

    if (previousLine && Math.random() < 0.20) {
        const words = previousLine
            .split(" ")
            .map(word => word.replace(/[^a-zA-Z]/g, ""))
            .filter(word => word.length >= 5);

        if (words.length > 0) {
            return random(responseBars)(random(words));
        }
    }

    const type = Math.floor(Math.random() * 3);

    if (type === 0) {
        return random(rhymeTemplates)(rhymeWord);
    }

    if (type === 1) {
        return random(subjectBars)(enemy, random(subjects));
    }

    return random(objectBars)(random(weirdObjects));
}

/* ============================================================
   RAP BAR
============================================================ */

function rapBar() {

    if (
        rhymeWords.length === 0
    ) {

        rhymeWords =
            newRhymeGroup();

    }

    const rhyme =
        rhymeWords.shift();

    const line =
        generateLine(
            rhyme
        );

    addLine(
        currentRapper,
        line
    );

    speakLine(
        line,
        currentRapper
    );

    previousLine =
        line;

    rapperBar++;

    if (
        rapperBar >=
        BARS_PER_TURN
    ) {

        rapperBar = 0;

        currentRapper =
            currentRapper === 0
            ? 1
            : 0;

        rhymeWords =
            newRhymeGroup();

        setActiveRapper(
            currentRapper
        );

    }

}


/* ============================================================
   BEAT FLASH
============================================================ */

function flashBeat() {

    beatDot.classList.remove(
        "hit"
    );

    void beatDot.offsetWidth;

    beatDot.classList.add(
        "hit"
    );

}


/* ============================================================
   AUDIO VISUALIZER
============================================================ */

const canvas =
    document.getElementById(
        "visualizer"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let audioContext =
    null;

let analyser =
    null;

let sourceNode =
    null;

let frequencyData =
    null;

let visualizerReady =
    false;

function setupAudioVisualizer() {

    if (visualizerReady) {
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.72;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;

    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    sourceNode =
        audioContext.createMediaElementSource(
            music
        );

    sourceNode.connect(analyser);
    analyser.connect(audioContext.destination);

    visualizerReady = true;

    console.log(
        "AudioContext:",
        audioContext.state,
        "FFT bins:",
        analyser.frequencyBinCount
    );

}


/* ============================================================
   RESIZE VISUALIZER
============================================================ */

function resizeVisualizer() {

    const rect =
        canvas
        .getBoundingClientRect();

    const dpr =
        window.devicePixelRatio ||
        1;

    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                dpr
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                dpr
            )
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeVisualizer
);


/* ============================================================
   VISUALIZER DRAW
============================================================ */

function drawVisualizer() {

    requestAnimationFrame(
        drawVisualizer
    );

    if (
        !analyser ||
        !frequencyData
    ) {

        return;

    }

    analyser.getByteFrequencyData(
        frequencyData
    );

    const rect =
        canvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
    Find whether we're actually receiving audio.
    */

    let maxValue = 0;

    for (
        let i = 0;
        i < frequencyData.length;
        i++
    ) {

        if (
            frequencyData[i] > maxValue
        ) {

            maxValue =
                frequencyData[i];

        }

    }

    if (
        maxValue === 0
    ) {

        debugText.textContent =
            "VISUALIZER: AUDIO DATA = 0";

        /*
        Draw a faint baseline so you can tell
        the canvas itself is visible.
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.12)";

        ctx.fillRect(
            0,
            height - 2,
            width,
            2
        );

        return;

    }

    debugText.textContent =
        "VISUALIZER: OK  " +
        maxValue;

    /*
    Real frequency spectrum:
    left = low frequency
    right = high frequency

    Use logarithmic spacing because pitch/frequency
    is much easier to read this way than linear bins.
    */

    const BAR_COUNT =
        96;

    const gap =
        2;

    const barWidth =
        width /
        BAR_COUNT;

    const nyquist =
        audioContext.sampleRate /
        2;

    const minFrequency =
        35;

    const maxFrequency =
        Math.min(
            16000,
            nyquist
        );

    let bassTotal = 0;
    let bassSamples = 0;

    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {

        const ratio =
            i /
            (
                BAR_COUNT -
                1
            );

        /*
        Logarithmic frequency position.
        */

        const frequency =
            minFrequency *
            Math.pow(
                maxFrequency /
                minFrequency,
                ratio
            );

        const binIndex =
            Math.min(
                frequencyData.length - 1,
                Math.max(
                    0,
                    Math.round(
                        frequency /
                        nyquist *
                        (
                            frequencyData.length -
                            1
                        )
                    )
                )
            );

        const value =
            frequencyData[
                binIndex
            ] /
            255;

        const boosted =
            Math.pow(
                value,
                0.68
            );

        const barHeight =
            Math.max(
                2,
                boosted *
                (
                    height -
                    24
                )
            );

        /*
        BAR COLOR IS BASED ON HEIGHT / LOUDNESS:

        short bar  = green
        medium     = yellow
        tall       = orange
        very tall  = red
        */

        const heightRatio =
            Math.min(
                1,
                barHeight /
                (
                    height -
                    24
                )
            );

        /*
        HSL hue:
        120 = green
        60  = yellow
        30  = orange
        0   = red
        */

        const hue =
            120 -
            (
                heightRatio *
                120
            );

        const color =
            `hsl(${hue}, 95%, 52%)`;

        ctx.fillStyle =
            color;

        ctx.shadowBlur =
            8;

        ctx.shadowColor =
            color;

        ctx.fillRect(

            i *
            barWidth,

            height -
            barHeight,

            Math.max(
                1,
                barWidth -
                gap
            ),

            barHeight

        );

        /*
        Rough bass area for screen pulse.
        */

        if (
            frequency <
            180
        ) {

            bassTotal +=
                value;

            bassSamples++;

        }

    }

    ctx.shadowBlur =
        0;

    const bass =
        bassSamples > 0

        ? bassTotal /
          bassSamples

        : 0;

    if (
        bass >
        0.42
    ) {

        const pulse =
            1 +
            (
                bass *
                0.006
            );

        page.style.transform =
            `scale(${pulse})`;

    }

    else {

        page.style.transform =
            "scale(1)";

    }

}


/* ============================================================
   MASTER MUSIC SYNC
============================================================ */

function syncLoop() {

    requestAnimationFrame(
        syncLoop
    );

    if (
        !started
    ) {

        return;

    }

    const time =
        music.currentTime;

    /*
    Detect the MP3 looping back to the start.
    */

    if (
        time <
        previousMusicTime -
        1
    ) {

        lastBeat =
            -1;

        lastRapBar =
            -1;

        speechSynthesis.cancel();

    }

    previousMusicTime =
        time;

    /*
    Bar counter.
    */

    const songBar =
        Math.floor(
            time /
            BAR_SECONDS
        ) +
        1;

    barCounter.textContent =
        `BAR ${songBar}`;

    /*
    Beat pulse.
    */

    const beat =
        Math.floor(
            time /
            BEAT_SECONDS
        );

    if (
        beat !==
        lastBeat
    ) {

        lastBeat =
            beat;

        flashBeat();

    }

    /*
    Rap starts at 9.6 seconds.
    Then one new line per bar.
    */

    if (
        time >=
        RAP_START_TIME
    ) {

        const rapTime =
            time -
            RAP_START_TIME;

        const rapBarNumber =
            Math.floor(
                rapTime /
                BAR_SECONDS
            );

        if (
            rapBarNumber >
            lastRapBar
        ) {

            lastRapBar =
                rapBarNumber;

            rapBar();

        }

    }

    debugText.textContent =
        `${time.toFixed(2)}s`;

}


/* ============================================================
   START BUTTON
============================================================ */

startScreen.addEventListener(

    "click",

    async () => {

        if (
            started
        ) {

            return;

        }

        try {

            speechSynthesis.cancel();

            /*
            Set up Web Audio FIRST while this
            is still directly inside the user click.
            */

            setupAudioVisualizer();

            if (
                audioContext.state ===
                "suspended"
            ) {

                await audioContext.resume();

            }

            console.log(
                "AudioContext after resume:",
                audioContext.state
            );

            resizeVisualizer();

            music.pause();
            music.currentTime = 0;

            /*
            Now play the MP3 through:
            music -> analyser -> speakers
            */

            await music.play();

            console.log(
                "SONG STARTED"
            );

            currentRapper = 0;
            rapperBar = 0;

            rhymeWords =
                newRhymeGroup();

            previousLine = "";

            lastRapBar = -1;
            lastBeat = -1;

            previousMusicTime = 0;

            started = true;

            startScreen.style.display =
                "none";

            setActiveRapper(
                0
            );

            requestAnimationFrame(
                syncLoop
            );

            requestAnimationFrame(
                drawVisualizer
            );

            console.log(
                "VISUALIZER STARTED"
            );

        }

        catch (
            error
        ) {

            console.error(
                "START FAILED:",
                error
            );

            alert(
                "Could not start the rap battle. Open F12 Console for the exact error."
            );

        }

    }

);


/* ============================================================
   AUDIO DEBUGGING
============================================================ */

music.addEventListener(

    "loadeddata",

    () => {

        console.log(
            "rapsong.mp3 loaded"
        );

    }

);

music.addEventListener(

    "canplay",

    () => {

        console.log(
            "rapsong.mp3 can play"
        );

    }

);

music.addEventListener(

    "play",

    () => {

        console.log(
            "rapsong.mp3 playback started"
        );

    }

);

music.addEventListener(

    "error",

    () => {

        console.error(
            "Could not load rapsong.mp3",
            music.error
        );

    }

);
