<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite AI Rap Battle</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080808;
    color: white;

    font-size: clamp(70px, 13vw, 190px);
    font-weight: 900;

    cursor: pointer;
    user-select: none;

    transition:
        background 0.2s,
        letter-spacing 0.2s;
}

#startScreen:hover {
    background: #111;
    letter-spacing: 8px;
}

#page {
    width: 100%;
    height: 100%;

    transition:
        transform 0.08s,
        filter 0.08s;
}

.topbar {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: #111;
    border-bottom: 1px solid #333;
}

.title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
}

.bpm {
    font-size: 14px;
    opacity: 0.6;
}

.battle {
    display: grid;
    grid-template-columns: 1fr 1fr;

    height: calc(100vh - 70px - 130px);
}

.rapper {
    position: relative;

    padding: 30px;

    overflow: hidden;

    transition:
        background 0.15s,
        transform 0.12s,
        box-shadow 0.15s;
}

.rapper:first-child {
    border-right: 1px solid #333;
}

.rapper.active {
    background: #141414;

    box-shadow:
        inset 0 0 80px rgba(255,255,255,0.03);
}

.rapper.speaking {
    transform: scale(1.008);
}

.rapper-name {
    font-size: 38px;
    font-weight: 900;

    margin-bottom: 30px;

    transition:
        text-shadow 0.15s,
        transform 0.15s;
}

.rapper.active .rapper-name {
    text-shadow:
        0 0 18px rgba(255,255,255,0.4);
}

.status {
    position: absolute;

    top: 39px;
    right: 30px;

    font-size: 13px;
    font-weight: bold;

    opacity: 0.4;
}

.rapper.active .status {
    opacity: 1;
}

.lyrics {
    display: flex;
    flex-direction: column;

    gap: 18px;

    font-size: 24px;
    line-height: 1.35;
}

.line {
    opacity: 0;

    transform: translateY(10px);

    animation:
        lineAppear 0.18s forwards;

    transition:
        opacity 0.25s,
        transform 0.15s,
        text-shadow 0.15s;
}

.line.current {
    font-weight: bold;

    text-shadow:
        0 0 12px rgba(255,255,255,0.2);
}

.line.old {
    opacity: 0.3 !important;
}

@keyframes lineAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#visualizerContainer {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 130px;

    background:
        linear-gradient(
            to top,
            #050505,
            #0b0b0b
        );

    border-top: 1px solid #333;

    overflow: hidden;
}

#visualizer {
    width: 100%;
    height: 100%;

    display: block;
}

.frequencyLabel {
    position: absolute;

    bottom: 5px;

    font-size: 10px;

    opacity: 0.35;

    pointer-events: none;
}

#lowLabel {
    left: 10px;
}

#midLabel {
    left: 50%;
    transform: translateX(-50%);
}

#highLabel {
    right: 10px;
}

#beatDot {
    position: fixed;

    left: 50%;
    bottom: 140px;

    width: 10px;
    height: 10px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: white;

    opacity: 0.2;

    z-index: 20;
}

#beatDot.hit {
    animation:
        beatHit 0.14s;
}

@keyframes beatHit {
    0% {
        transform:
            translateX(-50%)
            scale(2.8);

        opacity: 1;
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);

        opacity: 0.2;
    }
}

#barCounter {
    position: fixed;

    top: 82px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 12px;

    opacity: 0.35;

    z-index: 50;
}

#debugText {
    position: fixed;
    right: 12px;
    bottom: 140px;

    font-size: 11px;
    opacity: 0.25;
    z-index: 30;
}
</style>
</head>

/* ============================================================
   TIMING
============================================================ */

const BPM = 100;

const BEAT_SECONDS =

/*
100 BPM:
1 beat = 0.6s
*/

const BAR_SECONDS =
    BEAT_SECONDS * 4;

/*
1 bar = 2.4s
*/

/*
Rap starts at 9.6s:

Bar 1 = 0.0
Bar 2 = 2.4
Bar 3 = 4.8
Bar 4 = 7.2
Bar 5 = 9.6

So first AI line begins at BAR 5.
*/

const BARS_PER_TURN = 4;

/* ============================================================
   HELPERS
============================================================ */

function random(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}

function shuffle(array) {

    const arr =
        [...array];

    for (
        let i =
            arr.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}

function newRhymeGroup() {

    return shuffle(
        random(
            rhymeGroups
        )
    );

}


/* ============================================================
   STATE
============================================================ */

let started = false;

let currentRapper = 0;

let rapperBar = 0;

let rhymeWords =

let previousLine = "";

let lastRapBar = -1;

let lastBeat = -1;

let previousMusicTime = 0;


/* ============================================================
   VOICES
============================================================ */

let voices = [];

let rapperVoices = [
    null,
    null
];

function loadVoices() {

    voices =
        speechSynthesis
        .getVoices();

    const english =
        voices.filter(
            voice =>
                voice.lang
                .toLowerCase()
                .startsWith("en")
        );

    const pool =
        english.length
        ? english
        : voices;

    if (
        pool.length > 0
    ) {

        rapperVoices[0] =
            pool[0];

    }

    if (
        pool.length > 1
    ) {

        rapperVoices[1] =
            pool[1];

    }

    else {

        rapperVoices[1] =
            pool[0] ||
            null;

    }

}

loadVoices();

speechSynthesis.onvoiceschanged =
    loadVoices;


/* ============================================================
   TEXT TO SPEECH
============================================================ */

function speakLine(
    text,
    rapperIndex
) {

    /*
    Prevent speech from queueing behind.
    If the previous line is still speaking,
    kill it and begin the new line now.
    */

    speechSynthesis.cancel();

    rapperElements.forEach(
        rapper =>
            rapper.classList.remove(
                "speaking"
            )
    );

    const speech =
        new SpeechSynthesisUtterance(
            text
        );

    if (
        rapperVoices[
            rapperIndex
        ]
    ) {

        speech.voice =
            rapperVoices[
                rapperIndex
            ];

    }

    /*
    Different voices.
    Faster so each bar has a better chance
    of finishing inside 2.4 seconds.
    */

    if (
        rapperIndex === 0
    ) {

        speech.rate =
            2.05;

        speech.pitch =
            0.72;

    }

    else {

        speech.rate =
            2.00;

        speech.pitch =
            1.15;

    }

    speech.volume =
        1;

    speech.onstart =
        () => {

            rapperElements[
                rapperIndex
            ].classList.add(
                "speaking"
            );

        };

    speech.onend =
        () => {

            rapperElements[
                rapperIndex
            ].classList.remove(
                "speaking"
            );

        };

    speech.onerror =
        () => {

            rapperElements[
                rapperIndex
            ].classList.remove(
                "speaking"
            );

        };

    speechSynthesis.speak(
        speech
    );

}


/* ============================================================
   ACTIVE RAPPER UI
============================================================ */

function setActiveRapper(
    rapperIndex
) {

    rapperElements.forEach(
        (rapper, index) => {

            rapper.classList.toggle(
                "active",
                index ===
                rapperIndex
            );

            rapper

}

   ADD LYRIC

function addLine(
    rapperIndex,
    text

        lyricsElements[

    container

            ".line"

        .forEach(
            line => {

                line.classList.add(

    const line =
        document.createElement(
            "div"
        );

    line.className =

    line.textContent =
        text;

    container.appendChild(
        line
    );

    const lines =
        container.querySelectorAll(
            ".line"
        );

    if (
        lines.length > 7
    ) {

        lines[0].remove();

    }

}


/* ============================================================
   RAP LINE GENERATION
============================================================ */

function generateLine(
    rhymeWord
) {

    const enemy =
        currentRapper === 0
        ? "GPT Dawg"
        : "MC Byte";

    const templates = [

        `${enemy}, your whole verse disappeared into the ${rhymeWord}`,

        `Bro entered the battle holding a ${random(weirdObjects)}, talking about ${rhymeWord}`,

        `You dropped one verse and somehow damaged the ${rhymeWord}`,

        `${enemy} tried cooking and somehow burnt the ${rhymeWord}`,

        `Your ${random(subjects)} has more talent than your ${rhymeWord}`,

        `Bro really brought a ${random(weirdObjects)} and called that ${rhymeWord}`,

        `Your whole career just disconnected from the ${rhymeWord}`,

        `I heard your last bar and immediately blamed the ${rhymeWord}`,

        `You tried roasting me and somehow complimented the ${rhymeWord}`,

        `Your bars got less power than a Chromebook running ${rhymeWord}`,

        `${enemy}, even your ${random(subjects)} wants a refund from the ${rhymeWord}`,

        `Bro said he had bars then pulled out a ${random(weirdObjects)} and yelled ${rhymeWord}`,

        `Your last rhyme was so ${random(reactions)} it frightened the ${rhymeWord}`,

        `You came here confident then got folded by the ${rhymeWord}`,

        `I would roast you harder but your ${random(subjects)} already did the ${rhymeWord}`,

        `Your flow loaded slower than school Wi-Fi in the ${rhymeWord}`

    ];

    if (
        previousLine &&
        Math.random() <
        0.25
    ) {

        const words =
            previousLine
                .split(" ")
                .map(
                    word =>
                        word.replace(
                            /[^a-zA-Z]/g,
                            ""
                        )
                )
                .filter(
                    word =>
                        word.length > 3
                );

        if (
            words.length > 0
        ) {

            const picked =
                random(
                    words
                );

            return (
                `You really said ${picked}, now explain that ${rhymeWord}`
            );

        }

    }

    return random(
        templates
    );

}


/* ============================================================
   RAP BAR
============================================================ */

function rapBar() {

    if (
        rhymeWords.length === 0
    ) {

        rhymeWords =
            newRhymeGroup();

    }

    const rhyme =
        rhymeWords.shift();

    const line =
        generateLine(
            rhyme
        );

    addLine(
        currentRapper,
        line
    );

    speakLine(
        line,
        currentRapper
    );

    previousLine =
        line;

    rapperBar++;

    if (
        rapperBar >=
        BARS_PER_TURN
    ) {

        rapperBar = 0;

        currentRapper =
            currentRapper === 0
            ? 1
            : 0;

        rhymeWords =
            newRhymeGroup();

        setActiveRapper(
            currentRapper
        );

    }

}

/* ============================================================
   AUDIO VISUALIZER
============================================================ */

const canvas =
    document.getElementById(
        "visualizer"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let audioContext =
    null;

let analyser =
    null;

let sourceNode =
    null;

let frequencyData =
    null;

let visualizerReady =
    false;

function setupAudioVisualizer() {

    if (
        visualizerReady
    ) {

        return;

    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        audioContext
        .createAnalyser();

    analyser.fftSize =
        1024;

    analyser.smoothingTimeConstant =
        0.78;

    frequencyData =
        new Uint8Array(
            analyser
            .frequencyBinCount
        );

    sourceNode =
        audioContext
        .createMediaElementSource(
            music
        );

    sourceNode.connect(
        analyser
    );

    analyser.connect(
        audioContext.destination
    );

    visualizerReady =
        true;

}


/* ============================================================
   RESIZE VISUALIZER
============================================================ */

function resizeVisualizer() {

    const rect =
        canvas
        .getBoundingClientRect();

    const dpr =
        window.devicePixelRatio ||
        1;

    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                dpr
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                dpr
            )
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeVisualizer
);


/* ============================================================
   VISUALIZER DRAW
============================================================ */

function drawVisualizer() {

    requestAnimationFrame(
        drawVisualizer
    );

    if (
        !analyser ||
        !frequencyData
    ) {

        return;

    }

    analyser
        .getByteFrequencyData(
            frequencyData
        );

    const rect =
        canvas
        .getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
    Spectrum goes:
    LEFT = bass / low pitch
    RIGHT = treble / high pitch

    Colour goes:
    GREEN -> YELLOW -> ORANGE -> RED
    */

    const BAR_COUNT =
        96;

    const usableBins =
        Math.min(
            frequencyData.length,
            250
        );

    const step =
        usableBins /
        BAR_COUNT;

    const gap =
        2;

    const barWidth =
        width /
        BAR_COUNT;

    let bassTotal =
        0;

    let bassSamples =
        0;

    for (
        let i = 0;

        i <
        BAR_COUNT;

        i++
    ) {

        const binIndex =
            Math.floor(
                i *
                step
            );

        const value =
            frequencyData[
                binIndex
            ] /
            255;

        const boosted =
            Math.pow(
                value,
                0.72
            );

        const barHeight =
            boosted *
            (
                height -
                24
            );

        const ratio =
            i /
            (
                BAR_COUNT -
                1
            );

        /*
        HSL hue:
        120 = green
        60  = yellow
        30  = orange
        0   = red
        */

        const hue =
            120 -
            (
                ratio *
                120
            );

        const color =
            `hsl(${hue}, 92%, 52%)`;

        ctx.fillStyle =
            color;

        ctx.shadowBlur =
            8;

        ctx.shadowColor =
            color;

        ctx.fillRect(

            i *
            barWidth,

            height -
            barHeight,

            Math.max(
                1,
                barWidth -
                gap
            ),

            barHeight

        );

        if (
            i <
            BAR_COUNT *
            0.14
        ) {

            bassTotal +=
                value;

            bassSamples++;

        }

    }

    ctx.shadowBlur =
        0;

    const bass =
        bassSamples > 0

        ? bassTotal /
          bassSamples

        : 0;

    /*
    Slight screen pulse on bass.
    */

    if (
        bass >
        0.50
    ) {

        const pulse =
            1 +
            (
                bass *
                0.005
            );

        page.style.transform =
            `scale(${pulse})`;

    }

    else {

        page.style.transform =
            "scale(1)";

    }

}


/* ============================================================
   MASTER MUSIC SYNC
============================================================ */

function syncLoop() {

    requestAnimationFrame(
        syncLoop
    );

    if (
        !started
    ) {

        return;

    }

    const time =
        music.currentTime;

    /*
    Detect the MP3 looping back to the start.
    */

    if (
        time <
        previousMusicTime -
        1
    ) {

        lastBeat =
            -1;

        lastRapBar =
            -1;

        speechSynthesis.cancel();

    }

    previousMusicTime =
        time;

    /*
    Bar counter.
    */

    const songBar =
        Math.floor(
            time /
            BAR_SECONDS
        ) +
        1;

    barCounter.textContent =
        `BAR ${songBar}`;

    /*
    Beat pulse.
    */

    const beat =
        Math.floor(
            time /
            BEAT_SECONDS
        );

    if (
        beat !==
        lastBeat
    ) {

        lastBeat =
            beat;

        flashBeat();

    }

    /*
    Rap starts at 9.6 seconds.
    Then one new line per bar.
    */

    if (
        time >=
        RAP_START_TIME
    ) {

        const rapTime =
            time -
            RAP_START_TIME;

        const rapBarNumber =
            Math.floor(
                rapTime /
                BAR_SECONDS
            );

        if (
            rapBarNumber >
            lastRapBar
        ) {

            lastRapBar =
                rapBarNumber;

            rapBar();

        }

    }

    debugText.textContent =
        `${time.toFixed(2)}s`;

}


/* ============================================================
   START BUTTON
============================================================ */

startScreen.addEventListener(

    "click",

    async () => {

        if (
            started
        ) {

            return;

        }

        try {

            /*
            IMPORTANT:
            Start MUSIC FIRST.

            This way if the visualizer fails,
            the song still plays.
            */

            music.pause();

            music.currentTime =
                0;

            speechSynthesis.cancel();

            await music.play();

            console.log(
                "SONG STARTED"
            );

            /*
            Reset battle.
            */

            currentRapper =
                0;

            rapperBar =
                0;

            rhymeWords =
                newRhymeGroup();

            previousLine =
                "";

            lastRapBar =
                -1;

            lastBeat =
                -1;

            previousMusicTime =
                0;

            started =
                true;

            startScreen.style.display =
                "none";

            setActiveRapper(
                0
            );

            requestAnimationFrame(
                syncLoop
            );

            /*
            Try starting visualizer AFTER music.
            */

            try {

                setupAudioVisualizer();

                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    await audioContext.resume();

                }

                resizeVisualizer();

                requestAnimationFrame(
                    drawVisualizer
                );

                console.log(
                    "VISUALIZER STARTED"
                );

            }

            catch (
                visualizerError
            ) {

                console.warn(
                    "Visualizer failed, but music is still playing:",
                    visualizerError
                );

            }

        }

        catch (
            error
        ) {

            console.error(
                "MUSIC FAILED:",
                error
            );

            alert(
                "rapsong.mp3 could not play. Make sure rapsong.mp3 is in the same folder as index.html."
            );

        }

    }

);


/* ============================================================
   AUDIO DEBUGGING
============================================================ */

music.addEventListener(

    "loadeddata",

    () => {

        console.log(
            "rapsong.mp3 loaded"
        );

    }

);

music.addEventListener(

    "canplay",

    () => {

        console.log(
            "rapsong.mp3 can play"
        );

    }

);

music.addEventListener(

    "play",

    () => {

        console.log(
            "rapsong.mp3 playback started"
        );

    }

);

music.addEventListener(

    "error",

    () => {

        console.error(
            "Could not load rapsong.mp3",
            music.error
        );

    }

);

</script>
